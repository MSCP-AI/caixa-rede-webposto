<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="MS Partners">
  <title>MS Partners</title>
  <rect width="320" height="180" rx="16" fill="#0B0C0E"/>

  <!-- colchete esquerdo -->
