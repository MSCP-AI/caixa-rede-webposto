name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (Nitro → .vercel/output)
        run: npm run build

      - name: Pull Vercel project settings
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to production
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Skip notice
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: |
          echo "Set repository secrets VERCEL_TOKEN (and optionally VERCEL_ORG_ID / VERCEL_PROJECT_ID)"
          echo "Or import https://github.com/MSCP-AI/caixa-rede-webposto in the Vercel dashboard."
          exit 0
